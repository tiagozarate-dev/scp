<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Operaciones básicas  </h1>
    <img src="https://tse3.mm.bing.net/th/id/OIP.4A0DpOLcR4sRFAUsiH6gqwHaFL?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="operaciones" width="200" id="imagenes">
    <br>
    <hr>
    <fieldset>
        <legend>Numeros a operar</legend>
        <label for="numero1">Ingrese Numero 1: </label>
        <input type="number" id="numero1">
        <br>
        <label for="numero2">Ingrese Numero 2:</label>
        <input type="number" id="numero2">
    </fieldset>
    <label for="operaciones">Seleccione una operacion: </label>
    <select name="operaciones" id="operaciones">
        <option value="">Seleccione</option>
        <option value="suma">Suma</option>
        <option value="resta">Resta</option>
        <option value="multiplicacion">Multiplicacion</option>
        <option value="division">Division</option>
    </select>
    <br>
    <button id="boton">Resultado</button>
    <p id="resultado"></p>
    <script src="js/app.js"></script>
</body>
</html>
